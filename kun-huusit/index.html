<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kun huusit taas — Hengittävä Äiti</title>
<meta name="description" content="Pieni miniopas äidille, joka katuu reaktiotaan ja haluaa ymmärtää, mitä kehossa tapahtui.">
<meta name="theme-color" content="#E8E6E3">
<link rel="icon" href="/kuvat/logo-merkki.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.leadconnectorhq.com" crossorigin>
<link rel="preconnect" href="https://link.msgsndr.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A2320;
    --cream: #FBF7F1;
    --grey: #E8E6E3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
    background: var(--grey);
    color: var(--ink);
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    line-height: 1.55;
    text-rendering: optimizeLegibility;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--cream);
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(42, 35, 32, 0.10);
    padding: 52px 44px 48px;
    text-align: left;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: clamp(1.7rem, 4.8vw, 2.2rem);
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 0.55em;
    color: var(--ink);
  }
  .lead {
    margin: 0 0 1.15em;
    font-size: 1.05rem;
    color: var(--ink);
  }
  .ghl-embed {
    width: 100%;
    min-height: 390px;
    margin: 0 -6px;
  }
  .ghl-embed iframe {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    width: 100% !important;
    height: 390px;
    min-height: 390px;
    border: 0;
    background: transparent;
  }
  .error {
    display: none;
    margin: 0.85em 0 0;
    font-size: 0.95rem;
    color: #7d2b2b;
  }
  .error.is-visible { display: block; }
  .note {
    margin: 1.1em 0 0;
    font-size: 0.92rem;
    color: var(--ink);
  }
  @media (max-width: 480px) {
    .card { padding: 40px 28px 36px; }
  }
</style>
</head>
<body>
  <main class="card" data-component="KunHuusitForm">
    <h1>Kun huusit taas</h1>
    <p class="lead">Pieni miniopas äidille, joka katuu reaktiotaan ja haluaa ymmärtää, mitä kehossa tapahtui.</p>

    <div class="ghl-embed">
      <iframe
        src="https://api.leadconnectorhq.com/widget/form/KwdnBPweNizsuCijX5sr"
        id="inline-KwdnBPweNizsuCijX5sr"
        data-layout="{'id':'INLINE'}"
        data-trigger-type="alwaysShow"
        data-trigger-value=""
        data-activation-type="alwaysActivated"
        data-activation-value=""
        data-deactivation-type="neverDeactivate"
        data-deactivation-value=""
        data-form-name="Kun huusit taas"
        data-height="390"
        data-layout-iframe-id="inline-KwdnBPweNizsuCijX5sr"
        data-form-id="KwdnBPweNizsuCijX5sr"
        title="Kun huusit taas">
      </iframe>
    </div>
    <p class="error" id="miniopas-error" role="alert">Lomakkeen lähetys ei onnistunut. Tarkista sähköposti ja kokeile uudelleen.</p>
    <p class="note">Opas lähtee sähköpostiisi heti lähetyksen jälkeen.</p>
  </main>

  <script src="https://link.msgsndr.com/js/form_embed.js"></script>
  <script>
  (function () {
    var FORM_ID = 'KwdnBPweNizsuCijX5sr';
    var THANKS = '/kiitos/kun-huusit/';
    var ALLOWED = {
      'https://api.leadconnectorhq.com': true,
      'https://link.apisystem.tech': true,
      'https://backend.leadconnectorhq.com': true,
      'https://msgsndr.com': true,
      'https://link.msgsndr.com': true
    };

    function goThanks() {
      window.location.href = THANKS;
    }

    function payloadOf(data) {
      if (Array.isArray(data)) return data[1] || {};
      if (data && typeof data === 'object') return data.payload || data.data || data;
      return {};
    }

    function typeOf(data) {
      if (Array.isArray(data)) return data[0];
      if (!data || typeof data !== 'object') return '';
      return data.type || data.event || data.name || '';
    }

    function isConfirmedSubmit(data) {
      var type = typeOf(data);
      var payload = payloadOf(data);
      if (type === 'highlevel.setHeight' || type === 'set-sticky-contacts') return false;
      if (type !== 'msgsndr-form-submit' && type !== 'form-submit') return false;
      if (payload.formId && payload.formId !== FORM_ID) return false;
      return Boolean(payload.fingerprint || payload.contactId);
    }

    function revealIframe() {
      var iframe = document.getElementById('inline-' + FORM_ID);
      if (!iframe) return;
      iframe.style.setProperty('display', 'block', 'important');
      iframe.style.setProperty('visibility', 'visible', 'important');
      iframe.style.setProperty('opacity', '1', 'important');
    }

    window.addEventListener('message', function (event) {
      if (!ALLOWED[event.origin]) return;
      var type = typeOf(event.data);
      var payload = payloadOf(event.data);
      if (type === 'highlevel.setHeight' && payload && payload.height) {
        var iframe = document.getElementById('inline-' + FORM_ID);
        if (iframe) iframe.style.height = Math.max(390, Number(payload.height) || 0) + 'px';
        revealIframe();
      }
      if (!isConfirmedSubmit(event.data)) return;
      goThanks();
    });

    var iframe = document.getElementById('inline-' + FORM_ID);
    if (iframe) iframe.addEventListener('load', revealIframe);
    revealIframe();
    setTimeout(revealIframe, 800);
    setTimeout(revealIframe, 2500);
  })();
  </script>
</body>
</html>
