<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiitos — Hengittävä Äiti</title>
<meta name="description" content="Opas on nyt matkalla sähköpostiisi.">
<meta name="theme-color" content="#E8E6E3">
<link rel="icon" href="/kuvat/logo-merkki.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A2320;
    --cream: #FBF7F1;
    --grey: #E8E6E3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
    background: var(--grey);
    color: var(--ink);
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    line-height: 1.55;
    text-rendering: optimizeLegibility;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--cream);
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(42, 35, 32, 0.10);
    padding: 52px 44px 48px;
    text-align: left;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: clamp(2rem, 5.5vw, 2.55rem);
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 1.15em;
    color: var(--ink);
  }
  p {
    margin: 0 0 0.85em;
    font-size: 1.05rem;
    color: var(--ink);
  }
  .open {
    display: inline-block;
    margin: 0 0 0.85em;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 0.18em;
    text-decoration-thickness: 1.5px;
  }
  .open:hover { opacity: 0.72; }
  .wish { margin-top: 1.55em; }
  .signoff { margin-bottom: 0.15em; }
  .signname { margin-bottom: 0; }
  @media (max-width: 480px) {
    .card { padding: 40px 28px 36px; }
  }
</style>
</head>
<body>
  <main class="card" data-component="ThankYouKunHuusit">
    <h1>Kiitos ❤️</h1>
    <p>Opas on nyt matkalla sähköpostiisi 🕊️</p>
    <p><a class="open" href="/guides/Kun-huusit-taas-miniopas.pdf">Avaa opas heti</a></p>
    <p>Jos viesti ei näy muutamassa minuutissa, katso roskapostikansio.</p>
    <p class="wish">Toivottavasti opas tuo helpotusta juuri siihen hetkeen, jossa sitä eniten tarvitset.</p>
    <p class="signoff">Lämmöllä,</p>
    <p class="signname">Juliana · Hengittävä äiti</p>
  </main>
</body>
</html>
