<style>
  :root {
    --cream: #FBF7F1;
    --ink: #2A2320;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--ink);
    font-family: "Playfair Display", Georgia, serif;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid rgba(42, 35, 32, 0.08);
    border-radius: 12px;
    padding: 36px 28px;
    box-shadow: 0 1px 2px rgba(42, 35, 32, 0.08);
  }
  h1 {
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.15;
    margin: 0 0 16px;
  }
  p { margin: 0 0 10px; font-size: 17px; }
  .sub { margin-top: 18px; font-size: 14px; color: var(--ink-soft); }

</head>
